name: sticky-notes-development
# ─── Services ────────────────────────────────────────────────
services:

  # ── PostgreSQL 16 ─────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: stickynotes-postgres
    restart: always
    env_file:
      - .env
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-stickynotes}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - stickynotes

  # ── Adminer ───────────────────────────────────────────────
  adminer:
    image: adminer:latest
    container_name: stickynotes-adminer
    restart: always
    ports:
      - "${ADMINER_PORT}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - stickynotes

  # ── MinIO (object storage for note images) ────────────────
  minio:
    image: minio/minio:latest
    container_name: stickynotes-minio
    restart: always
    command: server /data --console-address ":9001"
    env_file:
      - .env
    ports:
      - "${MINIO_API_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - stickynotes

# ─── Volumes ─────────────────────────────────────────────────
volumes:
  postgres_data:
  minio_data:

# ─── Networks ────────────────────────────────────────────────
networks:
  stickynotes:
    driver: bridge
